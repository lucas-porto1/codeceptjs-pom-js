name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_URL: https://www.saucedemo.com
  API_URL: https://swapi.info/api
  STANDARD_USER: standard_user
  STANDARD_PASSWORD: secret_sauce
  LOCKED_USER: locked_out_user

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      report-artifact-id: ${{ steps.pages-artifact.outputs.artifact_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check code quality and configuration
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codeceptjs-failure-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare HTML reports for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts/pages
          if [ -f artifacts/report/api/testomatio-report.html ]; then
            mkdir -p artifacts/pages/api
            cp artifacts/report/api/testomatio-report.html artifacts/pages/api/index.html
          fi
          if [ -f artifacts/report/ui/testomatio-report.html ]; then
            mkdir -p artifacts/pages/ui
            cp artifacts/report/ui/testomatio-report.html artifacts/pages/ui/index.html
            cp artifacts/pages/ui/index.html artifacts/pages/index.html
          elif [ -f artifacts/pages/api/index.html ]; then
            cp artifacts/pages/api/index.html artifacts/pages/index.html
          fi

      - name: Upload HTML reports for GitHub Pages
        id: pages-artifact
        if: always() && github.ref == 'refs/heads/main' && hashFiles('artifacts/pages/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/pages

  publish-report:
    name: Publish HTML reports
    needs: validate
    if: always() && github.ref == 'refs/heads/main' && needs.validate.outputs.report-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Add report links to the job summary
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## CodeceptJS test reports' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest UI report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest API report](${REPORT_URL}api/)" >> "$GITHUB_STEP_SUMMARY"
