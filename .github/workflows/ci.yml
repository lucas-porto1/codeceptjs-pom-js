# GitHub Actions workflow for CodeceptJS API tests
# This workflow runs your tests in a secure, up-to-date cloud environment

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecept-output
          path: output/
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: report/
